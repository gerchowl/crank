[package]
name = "crank-ble"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
crank-devices.workspace = true
crank-fec.workspace = true
btleplug = "0.13.5"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = "1"

[features]
replay = []
# Test hook for the HIL harness (#44): write-without-response on fec3. Off by default.
hil = []

[[example]]
name = "hil_fec"
path = "examples/hil_fec/main.rs"
required-features = ["hil"]
test = true

[dev-dependencies]
crank-domain.workspace = true
crank-engine.workspace = true
crank-store.workspace = true
tempfile = "3"
serde_json.workspace = true
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
