[package]
name = "crank-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
crank-domain.workspace = true
crank-devices.workspace = true
futures-util = "0.3"
# The eased ERG target's trajectory generator: the Rust port of Ruckig (MIT), ADR-0002 §7.10.2's
# spike table (#620). `std` only: the engine is std; no position limits, tracking or waypoints used.
rsruckig = { version = "=3.0.1", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[features]
specta = ["dep:specta", "crank-domain/specta"]

[dev-dependencies]
# Enables the crate's own `specta` feature for tests, so the TypeScript export test
# runs in every workspace test run (#271).
crank-engine = { path = ".", features = ["specta"] }
crank-store.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "test-util", "time"] }
specta-typescript.workspace = true
specta-serde.workspace = true
