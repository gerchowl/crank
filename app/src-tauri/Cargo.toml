[package]
name = "crank-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "crank-desktop"

[lints]
workspace = true

[dependencies]
crank-core.workspace = true
crank-devices.workspace = true
crank-engine.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }

[dev-dependencies]
# The mock runtime builds a window and managed state for the command-layer tests.
tauri = { workspace = true, features = ["test"] }
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "test-util", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Embeds the WebDriver HTTP server (ADR-0001 §8.3, #35). Built only into the flake package
# `crank-desktop-e2e`; never part of the production feature set (the `deps-edges` check).
e2e = ["dep:tauri-plugin-wdio-webdriver"]
