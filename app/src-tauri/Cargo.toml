[package]
name = "crank-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "crank-desktop"

[lints]
workspace = true

[dependencies]
crank-core.workspace = true
crank-devices.workspace = true
crank-engine.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tauri-plugin-dialog.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The file log of the desktop process (#411): `fmt` writes it, `registry` hosts the per-target filter. No ANSI, no env-filter regex.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
specta.workspace = true
specta-typescript.workspace = true
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
# The bug-report surface (ADR-0003 §2.1): `Transport::Browser` only, so the core never opens a browser. `serde` is for
# `squelch::form::github::IssueForm`, which the issue-form sync test parses. Moving the rev is a reviewed PR; crates.io is #433.
squelch = { git = "https://github.com/gerchowl/squelch", rev = "4f0d0640e4dbf941b87b5cc5dc59e5e60dc86816", default-features = false, features = ["browser", "logs", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
# CGDisplayScreenSize for the window's display (#286); already in the lockfile through tao.
core-graphics = "0.25"
# The window's own display id (`NSWindow.screen` -> `NSScreenNumber`, #313); in the lockfile through tao and wry.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSScreen", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSDictionary", "NSString", "NSValue"] }

[dev-dependencies]
# The reconnect supervisor and the monotonic clock, to prove its events reach the log file (#411).
crank-ble.workspace = true
# The mock runtime builds a window and managed state for the command-layer tests.
tauri = { workspace = true, features = ["test"] }
serde_json.workspace = true
tempfile = "3"
# Parses `.github/ISSUE_TEMPLATE/bug.yml` in the issue-form sync test; squelch's own test uses it (`serde_yaml` is archived).
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Embeds the WebDriver HTTP server (ADR-0001 §8.3, #35). Built only into the flake package
# `crank-desktop-e2e`; never part of the production feature set (the `deps-edges` check).
e2e = ["dep:tauri-plugin-wdio-webdriver"]
