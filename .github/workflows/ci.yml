# MEASUREMENT BRANCH for ADR-0006 (#580): never merged. Times a cold build and a one-line crank-core edit
# of crank-cli in today's crane layout and in the per-crate prototype (crate2nix), Nix parallel (--max-jobs auto), on a 4-core hosted runner.
name: CI
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      macos:
        description: unused
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, system: aarch64-linux }
          - { os: macos-latest, system: aarch64-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Measure
        env:
          SYS: ${{ matrix.system }}
        run: |
          set -uo pipefail
          step() {
            name=$1; shift
            start=$(date +%s)
            nix build --no-link --max-jobs auto --log-format internal-json -v "$@" 2>&1 \
              | python3 -I scripts/nix-build-profile.py --json "prof-$name.json" > "prof-$name.txt"
            rc=$?
            echo "== $name: exit=$rc elapsed=$(( $(date +%s) - start ))s"
            grep -E '^(wall|compiles)' "prof-$name.txt"; sed -n '2,30p' "prof-$name.txt" | grep -v '^compiles' | head -25
          }
          step crane-cold ".#packages.$SYS.crank-cli"
          step crane-edit ".#packages.$SYS.crank-cli-edit"
          step c2n-cold ".#packages.$SYS.crank-cli-c2n"
          step c2n-edit ".#packages.$SYS.crank-cli-c2n-edit"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profiles-${{ matrix.system }}
          path: prof-*
  ci-summary:
    name: CI Summary
    if: always()
    needs: [measure]
    runs-on: ubuntu-latest
    steps:
      - run: echo measurement only
